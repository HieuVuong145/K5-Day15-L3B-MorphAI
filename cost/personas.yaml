# Mô phỏng chi phí khi dùng thật — Track C1: Lịch trình một ngày ở khu vui chơi
# Bản nháp CP3 (Người 3 — Thanh), bám khảo sát câu 1 (evidence/survey/responses.csv, n = 26)
# và bảng giá BTC (de-bai/further-reading/model-prices.md, xem 25/11/2026).

sessions: 50        # số phiên mô phỏng — bản nộp CP4 ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số nhóm khách dùng thử sản phẩm mỗi tháng ở 3 kịch bản (1 khu vui chơi lớn)
  low: 500
  base: 2000
  high: 5000
  source: "(tự ước tính — bản nháp CP3, chờ ghép số lượt khách công bố công khai ở spec.md §2)"

personas:           # phân theo khảo sát câu 1 (n = 26, bỏ 2 người 0 lần/năm → 24 người có đi)
  - name: di_it
    share: 0.46             # 11/24 người có đi (1 lần/năm)
    uses_per_month: 0.08    # 1 lần/năm ≈ 0.08 lần/tháng
    turns_per_session: 1    # (tự ước tính) xếp lịch 1 lượt
    source: "khảo sát câu 1 (n = 26): 11/24 người có đi chọn '1 lần' trong 12 tháng qua; turns_per_session (tự ước tính)"
  - name: di_vua
    share: 0.33             # 8/24 người có đi (2-3 lần/năm)
    uses_per_month: 0.21    # 2.5 lần/năm ≈ 0.21 lần/tháng
    turns_per_session: 2    # (tự ước tính) xếp lịch + chỉnh sửa 1 lần
    source: "khảo sát câu 1 (n = 26): 8/24 người có đi chọn '2-3 lần' trong 12 tháng qua; turns_per_session (tự ước tính)"
  - name: di_nhieu
    share: 0.21             # 5/24 người có đi (≥4 lần/năm)
    uses_per_month: 0.50    # (tự ước tính) ~6 lần/năm (P3 đi 3 lần/tháng ở trường hợp đặc biệt)
    turns_per_session: 3    # (tự ước tính) xếp trước + điều chỉnh khi đổi thời tiết/ngân sách
    source: "khảo sát câu 1 (n = 26): 5/24 người có đi chọn '4 lần trở lên'; uses_per_month & turns_per_session (tự ước tính)"

prices:             # USD / 1 triệu token — chép từ de-bai/further-reading/model-prices.md (BTC kiểm 25/11/2026)
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "https://ai.google.dev/gemini-api/docs/pricing (de-bai/further-reading/model-prices.md, xem 25/11/2026)"
  - model: gemini-4-hydrogen
    input: 1.50
    output: 7.50
    source: "https://ai.google.dev/gemini-api/docs/pricing (de-bai/further-reading/model-prices.md, xem 25/11/2026)"

